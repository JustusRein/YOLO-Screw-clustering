
services:
  image-generator:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: yolo-screw-image-generator
    working_dir: /workspace

    volumes:
      - ../01_fastener_generation/output/stl:/data/input/stl:ro
      - ../01_fastener_generation/output/generated_metadata.csv:/data/input/generated_metadata.csv:ro
      - ./scripts:/workspace/scripts:ro
      - ./output:/workspace/output

    environment:
      INPUT_DIR: /data/input/stl
      METADATA_FILE: /data/input/generated_metadata.csv
      OUTPUT_DIR: /workspace/output

      IMAGES_PER_MODEL: "5"
      RES_X: "512"
      RES_Y: "512"
      RANDOM_SEED: "42"

      CLASS_ATTRIBUTE: "screw_type"
      CYCLES_SAMPLES: "64"

    entrypoint:
      - /home/headless/blender/blender

    command:
      - --background
      - --python-exit-code
      - "1"
      - --python
      - /workspace/scripts/generate_stl_dataset.py

    shm_size: "2gb"
