services:
  freecad-generator:
    build: .

    container_name: freecad-fastener-generator

    environment:
      INPUT_CSV: /data/input/fasteners.csv
      OUTPUT_DIR: /data/output

    volumes:
      - ./input:/data/input
      - ./output:/data/output

    working_dir: /app

    command: bash /app/run.sh