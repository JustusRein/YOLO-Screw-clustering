services:
  image-generator:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: yolo-screw-image-generator
    working_dir: /workspace

    volumes:
      # Labeled target objects
      - ../01_fastener_generation/output/stl:/data/input/stl:ro
      - ../01_fastener_generation/output/generated_metadata.csv:/data/input/generated_metadata.csv:ro

      # Unlabeled distractor objects
      - ../02_distractor_generation/output/stl:/data/input/distractors:ro

      # Scripts and generated results
      - ./scripts:/workspace/scripts:ro
      - ./output:/workspace/output
      
      # Optional background images
      - ./input/backgrounds:/data/input/backgrounds:ro

    environment:
      INPUT_DIR: /data/input/stl
      METADATA_FILE: /data/input/generated_metadata.csv
      DISTRACTOR_DIR: /data/input/distractors
      OUTPUT_DIR: /workspace/output
      BACKGROUND_DIR: /data/input/backgrounds
      EEVEE_SAMPLES: ${EEVEE_SAMPLES:-16}

      # Number of scenes to render
      SCENE_COUNT: ${SCENE_COUNT:-1000}

      # Number of labeled fasteners per image
      TARGET_MIN: ${TARGET_MIN:-1}
      TARGET_MAX: ${TARGET_MAX:-5}

      # Number of unlabeled distractors per image
      DISTRACTOR_MIN: ${DISTRACTOR_MIN:-3}
      DISTRACTOR_MAX: ${DISTRACTOR_MAX:-10}

      # Probability of a negative scene without target fasteners
      NEGATIVE_SCENE_PROBABILITY: ${NEGATIVE_SCENE_PROBABILITY:-0.05}

      # Virtual work surface size in millimeters
      TABLE_SIZE: ${TABLE_SIZE:-220}

      # Render resolution
      RES_X: ${RES_X:-1280}
      RES_Y: ${RES_Y:-720}
      RESOLUTION_PERCENTAGE: ${RESOLUTION_PERCENTAGE:-100}

      # Random seed
      RANDOM_SEED: ${RANDOM_SEED:-42}

      # Metadata attribute used as the YOLO class
      CLASS_ATTRIBUTE: "screw_type"

    entrypoint:
      - /home/headless/blender/blender

    command:
      - --background
      - --python-exit-code
      - "1"
      - --python
      - /workspace/scripts/generate_stl_dataset.py

    shm_size: "2gb"