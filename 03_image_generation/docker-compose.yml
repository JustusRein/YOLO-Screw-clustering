services:
  image-generator:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: yolo-screw-image-generator
    working_dir: /workspace

    volumes:
      # Gelabelte Zielobjekte
      - ../01_fastener_generation/output/stl:/data/input/stl:ro
      - ../01_fastener_generation/output/generated_metadata.csv:/data/input/generated_metadata.csv:ro

      # Unlabeled Distraktoren
      - ../02_distractor_generation/output/stl:/data/input/distractors:ro

      # Skripte und Ergebnisse
      - ./scripts:/workspace/scripts:ro
      - ./output:/workspace/output
      
      # hintergrundbilder
      - ./input/backgrounds:/data/input/backgrounds:ro

    environment:
      INPUT_DIR: /data/input/stl
      METADATA_FILE: /data/input/generated_metadata.csv
      DISTRACTOR_DIR: /data/input/distractors
      OUTPUT_DIR: /workspace/output
      BACKGROUND_DIR: /data/input/backgrounds
      EEVEE_SAMPLES: "16"

      # Anzahl erzeugter Szenen
      SCENE_COUNT: "1000"

      # Anzahl gelabelter Fastener pro Bild
      TARGET_MIN: "1"
      TARGET_MAX: "5"

      # Anzahl unlabeled Distraktoren pro Bild
      DISTRACTOR_MIN: "3"
      DISTRACTOR_MAX: "10"

      # Anteil der Bilder ohne Schrauben/Muttern
      NEGATIVE_SCENE_PROBABILITY: "0.05"

      # Abmessungen der virtuellen Arbeitsfläche in mm
      TABLE_SIZE: "220"

      # Bildauflösung
      RES_X: "1280"
      RES_Y: "720"
      RESOLUTION_PERCENTAGE: "100"

      # Zufallsseed
      RANDOM_SEED: "42"

      # YOLO-Klasse aus der Fastener-Metadatei
      CLASS_ATTRIBUTE: "screw_type"

    entrypoint:
      - /home/headless/blender/blender

    command:
      - --background
      - --python-exit-code
      - "1"
      - --python
      - /workspace/scripts/generate_stl_dataset.py

    shm_size: "2gb"