
services:
  yolo-trainer:

    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}

    container_name: yolo-screw-trainer

    working_dir: /workspace

    volumes:
      - ../03_image_generation/output:/data/source:ro
      - ./scripts:/workspace/scripts:ro
      - ./output:/workspace/output
      - ./input/predict:/data/predict:ro

    environment:

      SOURCE_DIR: /data/source
      OUTPUT_DIR: /workspace/output

      PREDICT_DIR: /data/predict

      WEIGHTS: /workspace/output/weights/best.pt

      MODEL: ${MODEL:-yolo11n.pt}

      EPOCHS: ${EPOCHS:-100}

      # Reference RGB camera resolution
      IMAGE_SIZE: ${IMAGE_SIZE:-1280}
      RES_X: "1280"
      RES_Y: "720"

      # Preserve the 16:9 aspect ratio during training
      RECTANGULAR_TRAINING: "true"

      BATCH_SIZE: ${BATCH_SIZE:-2}

      WORKERS: ${WORKERS:-2}

      LEARNING_RATE: ${LEARNING_RATE:-0.001}

      PATIENCE: ${PATIENCE:-30}

      RANDOM_SEED: ${RANDOM_SEED:-42}

      DEVICE: ${DEVICE:-cpu}

      EXPECTED_WIDTH: "1280"
      EXPECTED_HEIGHT: "720"

      # Prediction settings
      CONFIDENCE: ${CONFIDENCE:-0.25}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.45}

    shm_size: "4gb"

    command:
      - python
      - /workspace/scripts/train.py
